name: Content checks

on:
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/content.mjs'
      - 'scripts/migrate-content.mjs'
      - 'src/types/curriculum.ts'

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run content:sync
      - run: npm run content:validate
      - run: npm run content:links
      - run: npm run build
