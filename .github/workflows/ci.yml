name: Dashboard CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run content:sync
      - run: npm run content:validate
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm run worker:check
      - run: npm run lint
      - run: npm run build
