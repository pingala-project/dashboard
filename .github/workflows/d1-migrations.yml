name: Apply D1 migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'wrangler.jsonc'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_D1_API_TOKEN" || { echo "CLOUDFLARE_D1_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 migrations apply pingala-dashboard --remote
