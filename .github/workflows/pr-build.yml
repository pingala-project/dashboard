name: PR build

# Builds a PR's dist bundle so the workflow_run preview deploy can publish it
# without ever exposing Cloudflare credentials to pull-request runs.

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Save PR number
        run: echo ${{ github.event.pull_request.number }} > pr-number.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-dist-${{ github.event.pull_request.number }}
          path: |
            dist/
            pr-number.txt
          retention-days: 7
