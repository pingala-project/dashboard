checkpoints:
  - id: chk-1
    question: If two non-zero vectors are perpendicular (orthogonal) to each other, what is their cosine similarity?
    options:
      - "1.0"
      - "0.0"
      - "-1.0"
      - Undefined
    correctIndex: 1
    explanation: Since cos(90°) = 0, the dot product and cosine similarity between orthogonal vectors is 0.
  - id: chk-2
    question: Why do we often use Cosine Similarity instead of Euclidean distance in text embeddings?
    options:
      - Because Euclidean distance cannot be calculated in Python
      - Cosine similarity focuses on directional alignment, removing length/word-count bias
      - Because cosine similarity is always positive
      - Because matrices cannot compute norms
    correctIndex: 1
    explanation: Cosine similarity measures angle rather than magnitude, which prevents long documents from having
      artificially huge distances compared to short documents.
