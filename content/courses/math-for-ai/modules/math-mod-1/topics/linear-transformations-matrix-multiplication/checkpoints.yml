checkpoints:
  - id: chk-matrix-1
    question: "What is the shape of output Y when multiplying input X (shape: [B, D_in]) with weight matrix W (shape: [D_in,
      D_out])?"
    options:
      - "[D_in, D_out]"
      - "[B, D_out]"
      - "[B, D_in]"
      - "[D_out, B]"
    correctIndex: 1
    explanation: Multiplying [B, D_in] @ [D_in, D_out] contracts over the inner dimension D_in, resulting in batch tensor
      [B, D_out].
