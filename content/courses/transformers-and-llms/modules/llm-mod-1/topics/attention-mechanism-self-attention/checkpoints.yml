checkpoints:
  - id: chk-attn-1
    question: What is the primary reason for dividing by √d_k in scaled dot-product attention?
    options:
      - To reduce computational complexity of matrix multiplication
      - To avoid softmax gradient saturation caused by large variance dot-products
      - To enforce causal masking during decoding
      - To convert vectors into unit probabilities
    correctIndex: 1
    explanation: As d_k grows, dot products increase in magnitude, causing softmax to yield extreme probabilities with
      vanishing gradients. √d_k division preserves unit variance.
  - id: chk-attn-2
    question: In causal autoregressive generation (like GPT-4), why is a triangular mask applied to attention scores?
    options:
      - To save memory during backprop
      - To prevent tokens from looking ahead at future tokens during generation
      - To normalize token frequencies
      - To make matrix invertible
    correctIndex: 1
    explanation: A causal lower-triangular mask ensures position i can only attend to positions j <= i, preserving the
      autoregressive property.
